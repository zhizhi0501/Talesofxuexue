#battle:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,8,18,.16),transparent 40%,rgba(2,8,18,.18));pointer-events:none}
.enemyHud{position:absolute;top:calc(7px + env(safe-area-inset-top));left:10px;right:10px;z-index:10}
.enemyTitle{font-size:12px;text-align:center;padding:5px 9px}
.hpRow{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:10px}
.hpBar{height:8px;flex:1;background:#21172b;border:1px solid #b68e44}.hpBar i{display:block;height:100%;width:100%;background:#83b34e;transition:width .3s}
#arena{position:absolute;left:0;right:0;top:14%;bottom:29%;z-index:2}
#snowBattle{position:absolute;right:9%;bottom:16%;width:120px;image-rendering:pixelated;filter:drop-shadow(0 4px 2px #000b);transition:transform .18s}
#cinnaBattle{position:absolute;right:34%;bottom:13%;width:80px;image-rendering:pixelated;filter:drop-shadow(0 3px 2px #0009)}
#monster{position:absolute;left:6%;bottom:18%;width:128px;image-rendering:pixelated;filter:drop-shadow(0 4px 2px #000a);transform-origin:center;transition:.25s}
#monster.dead{animation:die .7s forwards}@keyframes die{to{opacity:0;transform:scale(.1) rotate(-18deg);filter:blur(5px)}}
.skillTitle{position:absolute;top:19%;left:50%;transform:translateX(-50%);padding:6px 24px;font-size:14px;z-index:20;opacity:0}.skillTitle.show{animation:lab 1.4s}@keyframes lab{10%,72%{opacity:1}100%{opacity:0}}
#hit{position:absolute;left:12px;top:22%;font:bold 24px Georgia;color:#f9e1a5;text-shadow:2px 2px #000;z-index:20;opacity:0}#hit.show{opacity:1}
#fxPlate{position:absolute;left:3%;bottom:7%;width:61%;height:66%;object-fit:cover;opacity:0;z-index:12;mix-blend-mode:screen;filter:saturate(1.25) contrast(1.1);border-radius:6px}
#fxPlate.show{animation:plate .42s}@keyframes plate{0%{opacity:0;transform:scale(.86)}22%{opacity:.96;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.damage{position:absolute;left:21%;top:40%;z-index:24;font:bold 34px Georgia;color:#ffe082;text-shadow:2px 2px #000;opacity:0}.damage.show{animation:dmg .85s}@keyframes dmg{15%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-55px)}}
.debuff{position:absolute;left:16%;top:50%;z-index:24;padding:4px 8px;font-size:10px;opacity:0}.debuff.show{animation:db 1.6s}@keyframes db{15%,70%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

.status{position:absolute;left:8px;right:8px;bottom:calc(125px + env(safe-area-inset-bottom));height:87px;display:grid;grid-template-columns:1fr 1fr;gap:5px;z-index:16}
.card{padding:6px;background:#071b31f4;border:1px solid #b78e44;display:grid;grid-template-columns:42px 1fr;gap:7px;align-items:center}
.card img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}.nm{font-size:11px;font-weight:bold}.stat{font:10px monospace;margin-top:2px}.mini{height:5px;border:1px solid #645b3a;background:#182331;margin-top:3px}.mini i{display:block;height:100%;background:#83ad4c}.mini.tp i{background:#4aa1c3}
.cmd{position:absolute;left:8px;right:8px;bottom:calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;z-index:17}
.cmd button{height:51px;border:1px solid #9d7838;background:#0a223d;color:#f6e5bd;font-size:11px;font-weight:bold}.cmd .main{background:#32164d}.cmd button:disabled{opacity:.38}

#result{background:#061426}.result{position:absolute;inset:calc(24px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));padding:22px;text-align:center}.result h2{font-size:31px;color:#efca72;margin:12px 0 2px}.loot{margin-top:27px;border-top:1px solid #8c6d34;border-bottom:1px solid #8c6d34;padding:15px;display:grid;gap:8px}#return{position:absolute;left:20px;right:20px;bottom:22px;height:56px;background:#153a60;color:#fff0c8;border:2px solid #c49a4a;font-weight:bold;z-index:100}

<script>
(()=>{
const $=id=>document.getElementById(id), scenes=[...document.querySelectorAll('.scene')];
let ac=null,busy=false,hp=3000,maxhp=3000,hits=0,bgmNodes=[],bgmTimer=null,bgmStep=0,bgmMode='title';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function show(id){scenes.forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}
function audio(){if(!ac)ac=new(window.AudioContext||webkitAudioContext)();if(ac.state==='suspended')ac.resume()}
function osc(freq,dur=.25,type='sine',gain=.05,when=0){audio();let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,ac.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+when+dur);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+when);o.stop(ac.currentTime+when+dur+.02)}
function chord(fs,d=.7,g=.018){fs.forEach((f,i)=>osc(f,d,i?'sine':'triangle',g,i*.015))}
function sfx(type){if(type==='menu'){osc(620,.08,'square',.035);osc(930,.1,'square',.025,.05)}else if(type==='cast'){osc(190,.55,'sine',.055);osc(380,.55,'triangle',.035)}else if(type==='hit'){osc(900,.12,'square',.07);osc(140,.25,'sawtooth',.06,.05)}else if(type==='heal'){osc(520,.35,'sine',.04);osc(780,.4,'sine',.035,.09);osc(1040,.45,'sine',.03,.18)}}
function stopBgm(){if(bgmTimer)clearInterval(bgmTimer);bgmTimer=null}
const tracks={
title:[[64,67,71,74,71,67,69,71],[48,55,52,50],[0,2,4,7]],
world:[[64,66,67,71,69,67,66,64],[52,55,50,48],[0,4,7,11]],
battle:[[69,72,76,74,72,79,76,74],[45,45,48,43],[0,3,7,10]]
};
function startBgm(mode){stopBgm();audio();bgmMode=mode;bgmStep=0;const T=tracks[mode];
 const tick=()=>{let n=T[0][bgmStep%T[0].length],bass=T[1][Math.floor(bgmStep/2)%T[1].length],root=220*Math.pow(2,(n-69)/12),bf=110*Math.pow(2,(bass-45)/12);osc(root,.34,'triangle',.024);if(bgmStep%2===0)osc(bf,.72,'sine',.03);if(bgmStep%4===0){let r=220*Math.pow(2,(T[0][bgmStep%T[0].length]-69)/12);chord([r/2,r/2*Math.pow(2,4/12),r/2*Math.pow(2,7/12)],1.15,.009)}if(mode==='battle'&&bgmStep%2===0)osc(70,.07,'square',.017);bgmStep++};
 tick();bgmTimer=setInterval(tick,mode==='battle'?260:390)}
function speakCuteJP(){
 if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
 const parts=['雪雪〜！','こっちだよ♪','いっしょに冒険しよっ！'];let i=0;
 const go=()=>{if(i>=parts.length)return;let u=new SpeechSynthesisUtterance(parts[i++]);u.lang='ja-JP';u.rate=.82;u.pitch=1.68;u.volume=.95;
 let vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));u.voice=vs.find(v=>/Kyoko|Nanami|Sakura|Mei|female/i.test(v.name))||vs[0]||null;u.onend=()=>setTimeout(go,90);speechSynthesis.speak(u)};go()
}
function hpui(){hp=Math.max(0,hp);$('hpbar').style.width=(hp/maxhp*100)+'%';$('hptext').textContent=hp+' / '+maxhp}

 if(busy)return;busy=true;document.querySelectorAll('.cmd button').forEach(b=>b.disabled=true);$('skillTitle').textContent='祭夜法陣';anim($('skillTitle'),'show');$('snowBattle').style.transform='translateX(-9px)';sfx('cast');await wait(280);

}
