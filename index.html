#cb{position:absolute;right:35%;bottom:9%;width:88px;image-rendering:pixelated;animation:bob 1s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-4px)}}
#ritual,#impact,#bullet,#healfx{position:absolute;pointer-events:none;opacity:0;z-index:18}#ritual{left:-2%;top:25%;width:260px}#impact{left:-4%;top:20%;width:280px}#bullet{left:35%;top:46%;width:155px}#healfx{right:0;top:25%;width:230px}#ritual.go{animation:fx1 1.2s}#impact.go{animation:fx2 .65s}#bullet.go{animation:fly .55s linear}#healfx.go{animation:heal .9s}@keyframes fx1{15%,75%{opacity:1;transform:rotate(130deg) scale(1.05)}100%{opacity:0;transform:rotate(220deg) scale(1.3)}}@keyframes fx2{20%{opacity:1;transform:scale(.7)}100%{opacity:0;transform:scale(1.4)}}@keyframes fly{0%{opacity:1;transform:translateX(80px)}100%{opacity:0;transform:translateX(-220px)}}@keyframes heal{20%,70%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1.25)}}
#skill{position:absolute;top:18%;left:50%;transform:translateX(-50%);padding:6px 22px;font-size:14px;opacity:0;z-index:25}#skill.show{animation:lab 1.2s}@keyframes lab{10%,70%{opacity:1}100%{opacity:0}}#hit{position:absolute;left:12px;top:23%;font:bold 24px Georgia;color:#f9e1a5;text-shadow:2px 2px #000;opacity:0;z-index:25}#hit.show{opacity:1}#dmg{position:absolute;left:20%;top:38%;font:bold 35px Georgia;color:#ffe080;text-shadow:2px 2px #000;opacity:0;z-index:26}#dmg.show{animation:dmg .8s}@keyframes dmg{20%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-55px)}}
.status{position:absolute;left:8px;right:8px;bottom:calc(118px + env(safe-area-inset-bottom));height:73px;display:grid;grid-template-columns:1fr 1fr;gap:5px;z-index:20}.card{padding:5px;background:#071b31f4;border:1px solid #b78e44;display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center}.card img{width:32px;height:32px;object-fit:contain;image-rendering:pixelated}.nm{font-size:10px;font-weight:bold}.stat{font:9px monospace}.mini{height:4px;border:1px solid #645b3a;background:#182331;margin-top:2px}.mini i{display:block;height:100%;background:#83ad4c}.mini.tp i{background:#4aa1c3}.cmd{position:absolute;left:8px;right:8px;bottom:calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;z-index:20}.cmd button{height:48px;border:1px solid #9d7838;background:#0a223d;color:#f6e5bd;font-size:11px;font-weight:bold}.cmd .main{background:#32164d}
#result{background:#061426}.result{position:absolute;inset:calc(24px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));padding:22px;text-align:center}.result h2{font-size:31px;color:#efca72}.loot{margin-top:24px;border-top:1px solid #8c6d34;border-bottom:1px solid #8c6d34;padding:15px;display:grid;gap:8px}#return{position:absolute;left:20px;right:20px;bottom:22px;height:56px;background:#153a60;color:#fff0c8;border:2px solid #c49a4a;font-weight:bold}

<audio id="at" loop src="title.wav"></audio><audio id="aw" loop src="world.wav"></audio><audio id="ab" loop src="battle.wav"></audio><audio id="sm" src="menu.wav"></audio><audio id="sc" src="cast.wav"></audio><audio id="si" src="impact.wav"></audio><audio id="sh" src="heal.wav"></audio>
<section id="title" class="s on"><button id="new"></button><div class="copy">© 2026 CLOUD ISLAND PROJECT</div></section>
<section id="world" class="s"><div class="hud gold"><span>雪雪 Lv.28</span><span>雲朵島・風語平原</span></div><div class="quest gold">MAIN QUEST<br>走到大耳狗旁邊</div><div id="player"></div><div id="npc"></div><div id="near" class="gold">可以對話了！</div><div class="controls"><button id="up">▲</button><button id="left">◀</button><button id="right">▶</button><button id="down">▼</button></div><button id="act">對話</button></section>
<section id="dialog" class="s"><img id="ds" src="xuexue_base.png"><img id="dc" src="cinna_base.png"><div class="db"><div class="dn">大耳狗</div><div class="jp">雪雪〜！こっちだよ♪<br>いっしょに冒険しよっ！</div><div class="zh">雪雪～！這邊唷♪ 一起去冒險吧！</div></div></section>
<section id="battle" class="s"><div class="eh"><div class="et gold">暗影魔狼</div><div class="hpr"><span>HP</span><div class="bar"><i id="hpbar"></i></div><span id="hptext">3000 / 3000</span></div></div><div id="hit">0 Hit</div><div id="arena"><div id="wolf"></div><div id="xb"></div><img id="cb" src="cinna_base.png"><img id="ritual" src="ritual_circle.png"><img id="impact" src="ritual_impact.png"><img id="bullet" src="dark_bullet.png"><img id="healfx" src="heal_glow.png"><div id="skill" class="gold">祭夜法陣</div><div id="dmg">1268</div></div><div class="status"><div class="card"><img src="xuexue_base.png"><div><div class="nm">雪雪 Lv.28</div><div class="stat">HP 1920/1920 TP 120/120</div><div class="mini"><i style="width:100%"></i></div><div class="mini tp"><i style="width:100%"></i></div></div></div><div class="card"><img src="cinna_base.png"><div><div class="nm">大耳狗 Lv.27</div><div class="stat">HP 1560/1560 TP 134/150</div><div class="mini"><i style="width:100%"></i></div><div class="mini tp"><i style="width:89%"></i></div></div></div></div><div class="cmd gold"><button id="rit" class="main">祭夜法陣</button><button id="bolt">暗靈彈</button><button id="heal">光輝治癒</button><button id="guard">防禦</button></div></section>

</div><script>
(()=>{const $=id=>document.getElementById(id),ss=[...document.querySelectorAll('.s')],wait=ms=>new Promise(r=>setTimeout(r,ms));let x=170,y=430,near=false,busy=false,hp=3000,hits=0,dir=0;const A={title:$('at'),world:$('aw'),battle:$('ab')};function show(id){ss.forEach(s=>s.classList.remove('on'));$(id).classList.add('on')}function track(n){Object.entries(A).forEach(([k,a])=>{if(k!==n){a.pause();a.currentTime=0}});A[n].volume=.52;A[n].play().catch(()=>{})}function aud(id){$(id).currentTime=0;$(id).volume=.55;$(id).play().catch(()=>{})}function row(dx,dy){if(Math.abs(dx)>Math.abs(dy))return dx<0?1:2;return dy<0?3:0}function step(dx,dy){x=Math.max(10,Math.min(340,x+dx));y=Math.max(90,Math.min(620,y+dy));dir=row(dx,dy);$('player').style.left=x+'px';$('player').style.top=y+'px';$('player').style.backgroundPositionY=(-215*dir)+'px';$('player').classList.add('walk');clearTimeout(window.wt);window.wt=setTimeout(()=>$('player').classList.remove('walk'),250);near=Math.hypot(x-286,y-330)<120;$('near').style.display=near?'block':'none'}
['up','down','left','right'].forEach(id=>{let dx=0,dy=0;if(id==='up')dy=-18;if(id==='down')dy=18;if(id==='left')dx=-18;if(id==='right')dx=18;$(id).onpointerdown=()=>step(dx,dy)})
function voice(){if(!speechSynthesis)return;let u=new SpeechSynthesisUtterance('雪雪〜！こっちだよ♪ いっしょに冒険しよっ！');u.lang='ja-JP';u.rate=.74;u.pitch=1.8;speechSynthesis.cancel();speechSynthesis.speak(u)}function hpui(){hp=Math.max(0,hp);$('hpbar').style.width=(hp/3000*100)+'%';$('hptext').textContent=hp+' / 3000'}function anim(id,c){let e=$(id);e.classList.remove(c);void e.offsetWidth;e.classList.add(c)}function hit(d){hp-=d;hits++;$('hit').textContent=hits+' Hit';$('hit').classList.add('show');hpui();anim('wolf','hit');aud('si')}async function kill(){if(hp>0)return false;$('wolf').classList.add('dead');await wait(650);show('result');track('title');busy=false;return true}
async function ritual(){if(busy)return;busy=true;$('skill').textContent='祭夜法陣';anim('skill','show');$('xb').classList.add('cast');aud('sc');anim('ritual','go');await wait(650);anim('impact','go');anim('dmg','show');$('dmg').textContent='1268';hit(1268);await wait(430);anim('impact','go');anim('dmg','show');$('dmg').textContent='1842';hit(1842);await wait(850);$('xb').classList.remove('cast');if(await kill())return;busy=false}
async function bolt(){if(busy)return;busy=true;$('skill').textContent='暗靈彈';anim('skill','show');$('xb').classList.add('cast');aud('sc');anim('bullet','go');await wait(500);anim('impact','go');anim('dmg','show');$('dmg').textContent='842';hit(842);await wait(600);$('xb').classList.remove('cast');if(await kill())return;busy=false}
async function heal(){if(busy)return;busy=true;$('skill').textContent='光輝治癒';anim('skill','show');$('xb').classList.add('cast');aud('sh');anim('healfx','go');await wait(900);$('xb').classList.remove('cast');busy=false}
$('new').onclick=()=>{aud('sm');track('world');show('world')};$('act').onclick=()=>{if(!near)return;aud('sm');show('dialog');voice();setTimeout(()=>{hp=3000;hits=0;hpui();$('hit').classList.remove('show');$('wolf').classList.remove('dead');track('battle');show('battle')},3400)};$('rit').onclick=ritual;$('bolt').onclick=bolt;$('heal').onclick=heal;$('guard').onclick=()=>aud('sm');$('return').onclick=()=>{hp=3000;hits=0;hpui();$('hit').classList.remove('show');$('wolf').classList.remove('dead');track('world');show('world')};document.addEventListener('touchstart',()=>{if($('title').classList.contains('on'))track('title')},{once:true,passive:true});})();
</script></body></html>
