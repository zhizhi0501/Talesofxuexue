.worldHint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));padding:10px 16px;white-space:nowrap;font-size:13px}
.dialogue{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));padding:15px 16px 13px;min-height:148px;display:none}
.dialogue .name{display:inline-block;border:1px solid #b88f42;background:#071426;padding:3px 10px;margin-top:-30px;margin-bottom:10px;font-weight:800}
.dialogue .jp{font-size:17px;line-height:1.65}
.dialogue .zh{font-size:12px;color:#d8c59d;margin-top:8px}
.dialogue .next{text-align:right;color:#f0cc70;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}

#battle .dim{background:linear-gradient(180deg,rgba(3,10,24,.38),rgba(3,10,24,.04) 45%,rgba(3,10,24,.72))}
.battleHeader{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));padding:9px;text-align:center;font-size:12px}
.enemyName{position:absolute;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:13px;padding:5px 12px}
.heroBattle{position:absolute;left:17%;bottom:33%;font-size:55px;z-index:5;transition:transform .2s}
.enemy{position:absolute;right:15%;top:30%;font-size:62px;z-index:5;filter:drop-shadow(0 4px 2px #0008)}
.partyDog{position:absolute;left:36%;bottom:31%;font-size:36px;z-index:5}
.skillName{position:absolute;top:22%;left:50%;transform:translateX(-50%);min-width:180px;padding:8px 15px;text-align:center;font-weight:800;opacity:0;z-index:20}
.skillName.show{animation:skillLabel 1.3s}
@keyframes skillLabel{0%{opacity:0;transform:translate(-50%,-10px)}18%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

.magicCircle{position:absolute;width:180px;height:180px;left:50%;top:50%;transform:translate(-50%,-50%) scale(.05) rotate(0deg);border-radius:50%;border:3px solid #bc63ff;box-shadow:0 0 16px #d58cff, inset 0 0 24px #7a1ac8;opacity:0;z-index:8}
.magicCircle:before,.magicCircle:after{content:"";position:absolute;inset:18px;border:2px solid #ebc9ff;border-radius:50%;transform:rotate(45deg)}
.magicCircle:after{inset:39px;border-radius:0;transform:rotate(45deg)}
.magicCircle.cast{animation:circleCast 1.35s ease-out forwards}
@keyframes circleCast{0%{opacity:0;transform:translate(-50%,-50%) scale(.05) rotate(0)}35%{opacity:1;transform:translate(-50%,-50%) scale(.9) rotate(80deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(150deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35) rotate(220deg)}}

.orb{position:absolute;width:18px;height:18px;border-radius:50%;background:#d68cff;box-shadow:0 0 16px #c651ff,0 0 28px #6d12ad;opacity:0;z-index:9}
.orb.fly{animation:orbFly .78s ease-in forwards}
@keyframes orbFly{0%{opacity:0;left:28%;top:61%;transform:scale(.4)}15%{opacity:1}100%{opacity:1;left:70%;top:39%;transform:scale(2)}}

.impact{position:absolute;right:6%;top:19%;width:220px;height:220px;border-radius:50%;opacity:0;z-index:10;pointer-events:none}
.impact.one{animation:boom1 .55s ease-out}
.impact.two{animation:boom2 .7s ease-out}
@keyframes boom1{0%{opacity:0;transform:scale(.1);background:radial-gradient(circle,#fff 0 5%,#e29aff 6% 18%,#6b13a9aa 22% 46%,transparent 60%)}25%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
@keyframes boom2{0%{opacity:0;transform:scale(.15);background:radial-gradient(circle,#fff 0 4%,#8b31dd 8% 24%,#1d082faa 32% 56%,transparent 66%)}20%{opacity:1}100%{opacity:0;transform:scale(1.55)}}

.damage{position:absolute;right:20%;top:33%;font:bold 36px Georgia;color:#ffd86c;text-shadow:2px 2px #000;opacity:0;z-index:15}
.damage.hit{animation:dmg 1s ease-out}
@keyframes dmg{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.18)}100%{opacity:0;transform:translateY(-70px)}}
.statusTag{position:absolute;right:13%;top:42%;padding:4px 8px;font-size:11px;color:#e8c3ff;opacity:0;z-index:15}
.statusTag.show{animation:tag 2s}
@keyframes tag{10%,75%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

.commands{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.commands button{min-height:50px;border:1px solid #a8823f;background:#0b223d;color:#f5e4bd;font-weight:800}
.commands button.primary{background:#2f174d}
.commands button:disabled{opacity:.4}
.battleMsg{position:absolute;left:10px;right:10px;bottom:calc(126px + env(safe-area-inset-bottom));padding:8px 12px;font-size:12px;text-align:center}

#result{background:#061426}
.resultBox{position:absolute;inset:calc(34px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));padding:22px;text-align:center}
.resultBox h2{font-size:31px;margin:15px 0 6px;color:#f2ce77}
.loot{margin:28px 0;padding:14px;border-top:1px solid #85662d;border-bottom:1px solid #85662d;display:grid;gap:8px}
.resultBox button{margin-top:20px;min-height:48px;padding:0 26px;background:#0c2746;color:#f5e4bd;border:1px solid #b58b40}
</style>
</head>
<body>
<div id="game">

<section id="title" class="scene active">
  <div class="bg"></div><div class="dim"></div>
  <div class="titleLogo"><h1>雲朵島冒險</h1><small>CLOUD ISLAND ADVENTURE</small></div>
  <div class="titleMenu">
    <button id="newGame">NEW GAME</button>
    <button type="button">CONTINUE</button>
    <button type="button">OPTION</button>
  </div>
  <div class="copy">© 2026 CLOUD ISLAND PROJECT</div>
</section>

<section id="world" class="scene">
  <div class="bg"></div><div class="dim" style="background:linear-gradient(180deg,transparent 55%,rgba(2,8,18,.45))"></div>
  <div class="topHud gold"><span>雪雪　Lv.28　HP 1920</span><span>雲朵島</span></div>
  <div class="quest gold"><b>MAIN QUEST</b><br>前往廣場尋找大耳狗</div>
  <div class="avatar">🧚🏻‍♀️</div>
  <button id="cinna" class="cinna" aria-label="和大耳狗對話">☁️</button>
  <div id="hint" class="worldHint gold">點一下大耳狗</div>
  <div id="dialogue" class="dialogue gold">
    <div class="name">大耳狗</div>
    <div class="jp">雪雪！こっち、こっち〜！<br>いっしょに冒険しよう！</div>
    <div class="zh">雪雪！這邊、這邊～！一起去冒險吧！</div>
    <div class="next">▼</div>
  </div>
</section>

<section id="battle" class="scene">
  <div class="bg"></div><div class="dim"></div>
  <div class="battleHeader gold">BATTLE　TURN 1 / 100</div>
  <div class="enemyName gold">暗影使魔</div>
  <div id="hero" class="heroBattle">🧚🏻‍♀️</div>
  <div class="partyDog">☁️</div>
  <div id="enemy" class="enemy">👿</div>
  <div id="skillName" class="skillName gold">祭夜法陣</div>
  <div id="circle" class="magicCircle"></div>
  <div id="orb" class="orb"></div>
  <div id="impact" class="impact"></div>
  <div id="damage" class="damage">1268</div>
  <div id="statusTag" class="statusTag gold">侵蝕</div>
  <div id="battleMsg" class="battleMsg gold">雪雪的回合</div>
  <div class="commands gold">
    <button id="nightRitual" class="primary">祭夜法陣</button>
    <button id="shadowBolt">暗靈彈</button>
    <button id="heal">光輝治癒</button>
    <button id="guard">防禦</button>
  </div>
</section>

<section id="result" class="scene">
  <div class="resultBox gold">
    <div style="font-size:42px">✦</div>
    <h2>戰鬥勝利</h2>
    <div>VICTORY</div>
    <div class="loot">
      <div>EXP　+ 8250</div>
      <div>GOLD　+ 920</div>
      <div>雲朵結晶　× 1</div>
    </div>
    <button id="backMap">返回雲朵島</button>
  </div>
</section>
</div>

<script>
(() => {
  const scenes = [...document.querySelectorAll('.scene')];
  const $ = id => document.getElementById(id);
  let ac = null, bgmTimer = null, busy = false;

  function show(id) {
    scenes.forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }

  function initAudio() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  }

  function tone(f1, f2, dur=.35, type='sine', gain=.13) {
    initAudio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,f2), ac.currentTime + dur);
    g.gain.setValueAtTime(gain, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur + .02);
  }

  function chord(freqs, dur=.65, gain=.035) {
    initAudio();
    freqs.forEach((f,i) => {
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=i===0?'triangle':'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(gain,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur+.02);
    });
  }

  function startBgm() {
    initAudio();
    if (bgmTimer) return;
    const seq=[[220,277,330],[196,247,294],[174,220,262],[196,247,330]];
    let i=0;
    chord(seq[0],1.2,.026);
    bgmTimer=setInterval(()=>chord(seq[(++i)%seq.length],1.25,.026),1200);
  }

  function playJapaneseVoice() {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const text='雪雪！こっち、こっち〜！いっしょに冒険しよう！';
    const utter=new SpeechSynthesisUtterance(text);
    utter.lang='ja-JP'; utter.rate=.92; utter.pitch=1.35; utter.volume=1;
    const voices=speechSynthesis.getVoices();
    const ja=voices.find(v=>/^ja(-|_)/i.test(v.lang)) || voices.find(v=>v.lang==='ja-JP');
    if (ja) utter.voice=ja;
    speechSynthesis.speak(utter);
  }

  function resetAnim(el, cls) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  }

  async function castNightRitual() {
    if (busy) return; busy=true;
    document.querySelectorAll('.commands button').forEach(b=>b.disabled=true);
    $('battleMsg').textContent='雪雪開始詠唱……';
    resetAnim($('skillName'),'show');
    tone(260,520,.55,'sine',.12);
    $('hero').style.transform='translateY(-8px)';
    await wait(280);
    resetAnim($('circle'),'cast');
    chord([220,330,440],1.1,.045);
    $('battleMsg').textContent='「祭夜法陣！」';
    await wait(480);
    resetAnim($('orb'),'fly');
    tone(380,950,.62,'sawtooth',.09);
    await wait(620);

    resetAnim($('impact'),'one');
    resetAnim($('damage'),'hit'); $('damage').textContent='1268';
    tone(1050,110,.35,'square',.12);
    await wait(420);

    resetAnim($('impact'),'two');
    resetAnim($('damage'),'hit'); $('damage').textContent='1842';
    tone(820,70,.48,'sawtooth',.14);
    resetAnim($('statusTag'),'show');
    $('battleMsg').textContent='暗影使魔受到「侵蝕」！';
    await wait(1100);

    $('enemy').textContent='💥';
    $('battleMsg').textContent='暗影使魔被擊倒！';
    chord([523,659,784],.8,.055);
    await wait(900);
    show('result');
    busy=false;
  }

  async function castBolt() {
    if(busy)return; busy=true;
    $('battleMsg').textContent='暗靈彈！';
    resetAnim($('orb'),'fly'); tone(320,1100,.55,'square',.09);
    await wait(520); resetAnim($('impact'),'one'); resetAnim($('damage'),'hit');
    $('damage').textContent='842'; tone(700,90,.3,'square',.11);
    await wait(800); $('battleMsg').textContent='雪雪的回合'; busy=false;
  }

  async function castHeal() {
    if(busy)return; busy=true;
    $('battleMsg').textContent='光輝治癒';
    $('hero').style.filter='drop-shadow(0 0 14px #bfffe4)';
    chord([523,659,988],.9,.04);
    await wait(900); $('hero').style.filter=''; $('battleMsg').textContent='HP + 620'; busy=false;
  }

  const wait = ms => new Promise(r=>setTimeout(r,ms));

  $('newGame').addEventListener('click',()=>{startBgm();tone(330,160,.25,'square');show('world')});
  $('cinna').addEventListener('click',async()=>{
    tone(520,900,.25,'sine'); $('hint').style.display='none'; $('dialogue').style.display='block';
    playJapaneseVoice(); await wait(3500); show('battle');
  });
  $('nightRitual').addEventListener('click',castNightRitual);
  $('shadowBolt').addEventListener('click',castBolt);
  $('heal').addEventListener('click',castHeal);
  $('guard').addEventListener('click',()=>{tone(180,90,.2,'square');$('battleMsg').textContent='雪雪進入防禦狀態'});
  $('backMap').addEventListener('click',()=>{show('world');$('dialogue').style.display='none';$('hint').style.display='block';$('enemy').textContent='👿';});
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
})();
</script>
</body></html>
